async function finish(){if(state.current?.key&&!state.used.includes(state.current.key))state.used.push(state.current.key);state.current=null;state.buzz=null;state.answerVisible=false;state.answerMediaVisible=false;state.auction=null;await save()}
async function applyModifier(){const c=state.current,aid=document.getElementById('modA')?.value;if(!c||!aid)return;const a=state.players.find(x=>String(x.id)===aid);if(!a)return;const bId=document.getElementById('modB')?.value,b=state.players.find(x=>String(x.id)===bId);switch(c.effect){case'swap_lowest':{const low=[...state.players].sort((x,y)=>Number(x.score)-Number(y.score))[0];if(!low||low.id===a.id){say('Выбранный игрок уже отстаёт больше всех.');return} [a.score,low.score]=[low.score,a.score];break}case'swap_any':if(!b||a.id===b.id){say('Выбери двух разных игроков.');return}[a.score,b.score]=[b.score,a.score];break;case'threshold':a.score=Number(a.score)>1500?Number(a.score)-1000:Number(a.score)+500;break;case'free500':a.score=Number(a.score)+500;break;case'flip':a.score=-Number(a.score);break;case'minus1000':a.score=Number(a.score)-1000;break;case'ask_host':{const points=Number(document.getElementById('modPoints')?.value),reason=document.getElementById('modReason')?.value.trim();if(!Number.isFinite(points)||!reason){say('Укажи количество очков и обоснование.');return}a.score=Number(a.score)+points;break}}await finish()}
function playerRender(){const me=state.players.find(x=>String(x.id)===String(playerId)),winner=state.players.find(x=>String(x.id)===String(state.buzz?.player_id)),mine=String(state.buzz?.player_id)===String(playerId),locked=!!state.buzz,c=state.current;let action='';if(c?.kind==='auction'){const a=state.auction||{bids:[],closed:false},top=(a.bids||[]).reduce((m,x)=>Math.max(m,Number(x.amount)),0);action='<section class="card"><h3>♛ Аукцион</h3><p class="muted">Текущая ставка: <b class="gold">'+top+'</b>. Ставка не может превышать твой счёт. При верном ответе победитель получит её в двойном размере; если ответа нет — ставки спишутся у всех.</p><div class="field"><label>ТВОЯ СТАВКА В ОЧКАХ</label><input class="bidinput" id="bidAmount" type="number" min="'+(top+1)+'" max="'+Math.max(0,Number(me?.score||0))+'" placeholder="Выше '+top+'"></div><button class="primary" id="placeBid" '+(a.closed||Number(me?.score||0)<=top?'disabled':'')+'>Сделать ставку</button><div class="notice">'+(a.closed?'Аукцион завершён. Победитель: '+esc(state.players.find(x=>String(x.id)===String(a.winner))?.name||'—'):'Ведущий закроет аукцион после ставок.')+'</div></section>'}else if(c?.kind==='modifier')action='<div class="notice">Это модификатор. Ведущий применит его к выбранному игроку.</div>';else action='<button class="bigbuzz" id="buzz" '+(!c||locked?'disabled':'')+'>Я ЗНАЮ ОТВЕТ!</button>';shell('<div class="playerlayout"><section class="card center"><div class="eyebrow">ТЫ В ИГРЕ</div><h1>'+esc(me?.name||'Игрок')+'</h1><span class="pill">Комната '+esc(room)+'</span><div class="hr"></div><h3>'+(c?'Вопрос открыт!':'Ждём следующий вопрос…')+'</h3>'+action+'<div class="notice">'+(mine?'Ты нажал первым! Отвечай ведущему.':winner?'Первым отвечает: '+esc(winner.name):'Следи за экраном и будь готов нажать кнопку.')+'</div><h3>Твой счёт: '+Number(me?.score||0)+'</h3></section><section class="card"><h3>Таблица игроков</h3>'+scores()+'</section></div>');
document.getElementById('buzz')?.addEventListener('click',async()=>{try{const r=await rpc('buzz_quiz_room',{p_code:room,p_player_id:playerId});if(r?.accepted){state=r.state||r;render()}else say('Кто-то уже успел нажать кнопку!')}catch(e){say(e.message)}});
document.getElementById('placeBid')?.addEventListener('click',async()=>{const amount=Number(document.getElementById('bidAmount').value);if(!Number.isInteger(amount)||amount<1)return say('Введи целое число');try{const r=await rpc('place_auction_bid',{p_code:room,p_player_id:playerId,p_bid:amount});state=r.state||state;render();say('Ставка принята')}catch(e){say(e.message)}});
}
function tvRender(){const c=!!state.current,body='<div class="top"><div class="brand">СВОЯ <span>ИГРА</span></div><div class="tag">КОМНАТА '+esc(room)+'</div></div>'+(c?currentBox():'<div class="center"><div class="eyebrow">ИГРОВОЕ ТАБЛО</div>'+board()+'</div>')+(!c?'<div class="scoregrid">'+(state.players||[]).map(x=>'<div class="score center"><small>'+esc(x.name)+'</small><strong>'+Number(x.score||0)+'</strong></div>').join('')+'</div>':'')+'<div class="footer">Экран игры • синхронизация в реальном времени</div>';shell(body,true)}
function render(){if(!state)return;if(isTV)tvRender();else if(isHost)hostRender();else if(playerId)playerRender()}
async function join(){const n=p.get('name')||'';shell('<div class="playerlayout card"><div class="eyebrow">ПОДКЛЮЧЕНИЕ К ИГРЕ</div><h2>Комната '+esc(room)+'</h2><div class="field"><label>ТВОЁ ИМЯ</label><input id="name" maxlength="24" placeholder="Как тебя называть?" value="'+esc(n)+'"></div><button class="primary" id="enter" style="width:100%">Войти в игру</button></div>');document.getElementById('enter').onclick=async()=>{const name=document.getElementById('name').value.trim();if(!name)return say('Введи имя');try{const r=await rpc('join_quiz_room',{p_code:room,p_name:name});playerId=r.player_id;state=r.state||r;await load();sub()}catch(e){say(e.message)}}}
(async()=>{try{if(isTV||isHost){await load();sub()}else if(isPlayer)await join();else home()}catch(e){shell('<section class="card center"><h2>Не удалось открыть комнату</h2><p class="muted">'+esc(e.message)+'</p><button class="primary" onclick="location.href=location.pathname">На главную</button></section>')}})();
</script></body></html>
